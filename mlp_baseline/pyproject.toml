[project]
name = "cse291a-mlp-baseline"
version = "0.1.0"
description = "Standalone CPU MLP baseline, datasets, checkpoints, and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.24", "scikit-learn>=1.5", "pyarrow>=18", "huggingface-hub>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mlp-baseline = "mlp_baseline.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
