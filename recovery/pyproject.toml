[project]
name = "recovery"
version = "0.1.0"
description = "Recovery classifiers, the rules for undoing a tool call, and the rollback of recorded state"
readme = "README.md"
requires-python = ">=3.10"
# recovery.py needs only the standard library. recovery_classifiers.py also needs ../classifiers/mlp_baseline
# (pip install -e classifiers/mlp_baseline); logreg_baseline and knn_baseline are found from the repo checkout.
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["recovery", "recovery_classifiers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# logreg_baseline and knn_baseline are script folders put on sys.path at runtime; tell the checker too.
extraPaths = ["../classifiers/logreg_baseline", "../classifiers/knn_baseline", "../classifiers/mlp_baseline/src", "state_db"]
